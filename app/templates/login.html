<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>trocado — entrar</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0;
           display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
    form { background: #1e293b; padding: 2rem; border-radius: 12px; width: 280px; }
    h1 { font-size: 1.1rem; margin: 0 0 1rem; }
    input { width: 100%; padding: .6rem; border-radius: 8px; border: 1px solid #334155;
            background: #0f172a; color: #e2e8f0; box-sizing: border-box; }
    button { width: 100%; padding: .6rem; margin-top: .8rem; border: 0; border-radius: 8px;
             background: #38bdf8; color: #0f172a; font-weight: 600; cursor: pointer; }
    .error { color: #f87171; font-size: .85rem; margin-top: .6rem; }
  </style>
</head>
<body>
  <form method="post" action="/dashboard/login">
    <h1>trocado</h1>
    <input type="password" name="password" placeholder="Password" autofocus required>
    <button type="submit">Entrar</button>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
  </form>
</body>
</html>
